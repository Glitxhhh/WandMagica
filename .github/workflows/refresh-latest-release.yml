name: Refresh Latest Release Binary

# Rebuilds WandEnhancer.exe from master and re-uploads it onto whichever
# release GitHub currently marks "latest", overwriting the existing asset.
# This does NOT create a tag, a release, or a changelog entry - it just
# keeps the latest release's binary current between real version bumps.
on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - 'LICENSE'
  workflow_dispatch: {}

jobs:
  refresh-asset:
    # Same fork-safety scoping as release.yml: only this repository's own
    # "latest" release gets touched, never an unrelated downstream fork's.
    if: github.repository == 'Glitxhhh/WandMagica'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.17.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-panel/pnpm-lock.yaml

      - name: Find the current latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = gh release view --json tagName -q '.tagName'
          if (-not $tag) { throw "No existing release to refresh." }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build release
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Replace the binary on the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload "${{ steps.latest.outputs.tag }}" WandEnhancer/bin/Release/WandEnhancer.exe --clobber
