name: Release

on:
  push:
    tags:
      - '*'

jobs:
  publish-release:
    # Scoped the same way upstream scopes its own release job: to one canonical
    # repository, so a tag pushed on an unrelated downstream fork doesn't
    # unexpectedly publish a release there too. Update this to your own
    # "<owner>/<repo>" if you fork this fork and want releases of your own.
    if: github.repository == 'Glitxhhh/WandMagica'
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      RELEASE_VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 10.17.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-panel/pnpm-lock.yaml

      - name: Validate release metadata
        shell: pwsh
        run: ./scripts/validate-release-metadata.ps1 -ExpectedVersion $env:RELEASE_VERSION

      - name: Extract release notes from changelog
        shell: pwsh
        run: ./scripts/get-changelog-section.ps1 -Version $env:RELEASE_VERSION -OutputPath release-notes.md

      - name: Build release
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          # The binary is unsigned: it may trip SmartScreen/AV on first run, same
          # as before it was dropped from releases. Built fresh per tag by this
          # workflow, from source, not reused from a prior run.
          files: |
            WandEnhancer/bin/Release/WandEnhancer.exe
            CHANGELOG.md
          fail_on_unmatched_files: true
          # RC tags must not replace the latest stable release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
