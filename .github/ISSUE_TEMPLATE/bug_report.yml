name: Bug report
description: Create a report to help us improve
title: '[Bug]: '
labels: ["bug"]
assignees:
  - Glitxhhh
body:
  - type: markdown
    attributes:
      value: |
        This is the issue tracker for the [Glitxhhh/Wand-Enhancer](https://github.com/Glitxhhh/Wand-Enhancer) community continuation, not the original [k1tbyte/Wand-Enhancer](https://github.com/k1tbyte/Wand-Enhancer).

        **STOP BEFORE YOU POST: the only official executable is attached to a [Release on this repository](https://github.com/Glitxhhh/Wand-Enhancer/releases).** If you downloaded an executable from YouTube, Discord, a mirror, or any other third-party website, treat it as untrusted. Do not open issues about third-party binaries or stolen accounts here - this project is not related to those downloads.

  - type: checkboxes
    id: build_source_check
    attributes:
      label: Build Source Confirmation (REQUIRED)
      description: You must check this box to proceed.
      options:
        - label: I confirm that I got WandEnhancer from a Release on this repository or built it myself from my own fork/local source, and did not download an executable from YouTube, Discord, mirrors, issue comments, or any other third-party website.
          required: true

  - type: input
    id: client_version
    attributes:
      label: Client (Wand) version
      description: Include the exact version and stable/beta channel (for example, 12.52.0 stable).
    validations:
      required: true

  - type: input
    id: enhancer_version
    attributes:
      label: Enhancer version
      description: What version of this tool are you using?
    validations:
      required: true

  - type: textarea
    id: build_commit
    attributes:
      label: Build branch and commit
      description: If you used a Release binary, say which tag (for example, 2.2.0.0). If you built it yourself, copy the branch and source commit SHA from your Actions run or launcher.log - a version number alone cannot distinguish RC builds.
      placeholder: "2.2.0.0, or feature/rc_v_2.0.0.0 commit abc1234"
    validations:
      required: true

  - type: textarea
    id: patch_selection
    attributes:
      label: Selected patches and installation state
      description: List the enabled patches and whether this is a fresh installation, upgrade, automatic re-patch, or Restore.
    validations:
      required: true

  - type: textarea
    id: launcher_logs
    attributes:
      label: Launcher logs
      description: For startup failures, attach launcher.log and launcher.prev.log from the Wand installation root. If absent, say so. Redact personal paths; never include tokens, account storage dumps or executables.

  - type: textarea
    id: bug_description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      value: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.

  - type: textarea
    id: additional_context
    attributes:
      label: Screenshots & Additional context
      description: Drag and drop screenshots here, or add any other context about the problem.
